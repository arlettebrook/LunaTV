name: External Repo Sync

permissions:
  contents: write  # 允许推送更新

on:
  schedule:
    - cron: "0 0 * * *"  # 每天午夜执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync_external_branch:
    name: Sync branch from another repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 需要完整历史以便合并

      - name: Add external repository as remote
        run: |
          git remote add external https://github.com/SzeMeng76/LunaTV.git
          git fetch external main

      - name: Checkout target branch
        run: |
          git checkout bullet_comment || git checkout -b bullet_comment

      - name: Merge changes from external repo
        run: |
          git merge external/main --allow-unrelated-histories -m "Sync from SzeMeng76/LunaTV:main"

      - name: Push updates
        run: |
          git push origin bullet_comment

      - name: Success Message
        if: success()
        run: echo "✅ Sync completed successfully!"

      - name: Failure Message
        if: failure()
        run: |
          echo "❌ Sync failed. Possible causes:"
          echo "1. Merge conflict"
          echo "2. Invalid remote or branch name"
          echo "3. Permission issue"
          exit 1
